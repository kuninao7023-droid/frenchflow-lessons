name: Publish monthly original text

on:
  schedule:
    - cron: '0 0 1 * *' # UTC 00:00 = Japan 09:00, first day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-text-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Official v6.0.0 tag -> commit refs verified using GitHub's public API.
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: Run local synthetic tests (no API)
        run: python -m unittest discover -v
      - name: Generate current Japan month or skip verified existing pack
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD }}
          INPUT_PRICE_USD_PER_M: ${{ vars.INPUT_PRICE_USD_PER_M }}
          OUTPUT_PRICE_USD_PER_M: ${{ vars.OUTPUT_PRICE_USD_PER_M }}
        run: python tools/generate_monthly.py --month "$(TZ=Asia/Tokyo date +%Y-%m)"
      - name: Commit only complete packs and feed when changed
        shell: bash
        run: |
          set -euo pipefail
          git add -- packs/*.json feed.json
          if git diff --cached --quiet -- packs feed.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish original monthly text lessons' -- packs feed.json
          git push origin HEAD:main
